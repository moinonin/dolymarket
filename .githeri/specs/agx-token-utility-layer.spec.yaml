task_id: agx-token-utility-layer
status: active
archetype: transactional_ledger
summary: "Algoxen (AGX) token utility layer for the existing Dolymarket CLOB. Adds a double-entry AGX ledger with four balance buckets, staking with a 7-day lock and 3-day cooldown, tiered taker-fee discounts, 100 AGX optimistic-oracle dispute bonds with slash-to-treasury, feature gating bonds for Pro Desks and official markets, and idempotent 24-hour epoch fee distribution splitting 40 percent to creators and 60 percent to stakers. AGX is purely complementary: every existing USDC trading, collateral, settlement and resolution path keeps working for a user holding zero AGX."
entrypoint: app/main.py
scope: "Additive brownfield extension to the existing FastAPI + React - SQLAlchemy Dolymarket repository. Extend app/models/domain.py, app/services/, app/api/v1/, app/engine/clob.py, app/main.py and frontend/src/. Do not scaffold a new project, do not declare a second declarative Base or FastAPI instance, do not regenerate existing files, and do not remove or rename any endpoint recorded in .githeri/baseline.json."
out_of_scope:
  - "On-chain contract deployment, Foundry tooling, wallets, and Arbitrum RPC transaction signing"
  - "A second matching engine or a parallel order path; AGX hooks into the existing in-memory CLOB only"
  - "Making AGX a prerequisite for trading, depositing, withdrawing collateral, holding positions or redeeming payouts"
  - "Pooled or commingled AGX custody, transferable staking receipts, or AGX as a tradable outcome token"
  - "Governance voting, proposal execution, or discretionary treasury spending"
  - "Binary floating point anywhere in AGX token math"
assumptions:
  - "The change is additive: every endpoint recorded in .githeri/baseline.json must keep resolving after the extension"
  - "AGX amounts are decimal strings at every JSON boundary and are parsed with decimal.Decimal, never float"
  - "Error responses follow the existing repository convention of HTTP status plus a stable UPPER_SNAKE code in detail"
  - "On-chain balance verification is performed by the sync endpoint; the platform never mints spendable AGX without a verified deposit record"
business_rules:
  - name: "Zero-Token Invariant"
    formula: "A user with no AgxBalance row, a zero staked_balance, or a failed on-chain sync is Tier 0 with discount 0.00; taker fee, collateral deposit/withdraw, order matching, settlement and payout redemption all remain available and unchanged."
  - name: "Double-Entry AGX Ledger"
    formula: "Every mutation of the spendable bucket writes exactly one immutable AgxLedger row (user_id, kind, amount, balance_after, reference_id, created_at); amount is the signed change to the spendable balance, balance_after is the spendable balance after the mutation, and the sum of a user's ledger amounts equals that user's spendable balance. Bucket moves that leave the spendable balance unchanged (UNSTAKE_COOLDOWN, SLASH) still emit one row with amount 0 so every mutation remains auditable. Kinds are limited to DEPOSIT, WITHDRAWAL, STAKE, UNSTAKE_COOLDOWN, WITHDRAW_STAKE, FEE_REWARD, DISPUTE_LOCK, DISPUTE_RETURN, DISPUTE_REWARD, SLASH, GATING_LOCK, GATING_RELEASE."
  - name: "Verified Balance Ceiling"
    formula: "spendable balance after POST /api/v1/agx/sync-balance equals prior spendable balance plus the verified net positive delta; spendable balance can never exceed cumulative verified on-chain deposits minus cumulative withdrawals."
  - name: "Stake Lock"
    formula: "amount >= AGX_MIN_STAKE (1) is required (HTTP 422 AGX_STAKE_BELOW_MINIMUM); a stake row is created with status ACTIVE and locked_until = created_at + AGX_MIN_STAKE_LOCK_DAYS (7 days); POST /api/v1/agx/unstake before locked_until returns HTTP 422 AGX_STAKE_LOCKED."
  - name: "Unstake Cooldown"
    formula: "Unstaking moves the amount out of staked_balance into a PENDING AgxUnstakeCooldown row with cooldown_until = now + AGX_UNSTAKE_COOLDOWN_DAYS (3 days) and sets the stake status to COOLDOWN; POST /api/v1/agx/withdraw before cooldown_until returns HTTP 422 AGX_COOLDOWN_ACTIVE; after the deadline the cooldown completes, the stake becomes WITHDRAWN, and the amount returns to spendable balance."
  - name: "Tier Discount Ladder"
    formula: "Tier is derived only from staked_balance: Tier 0 below 100 AGX (0 percent), Tier 1 at 100 through 999.99 AGX (5 percent), Tier 2 at 1000 through 4999.99 AGX (10 percent), Tier 3 at 5000 AGX and above (15 percent). Discounts are relative to the existing base fee, never absolute fee replacement."
  - name: "Effective Taker Fee"
    formula: "apply_fee_discount(user_id, base_fee) = base_fee * (Decimal('1.0') - tier_discount), quantized to 18 decimal places with ROUND_DOWN; a missing AgxBalance row yields base_fee unchanged. The existing parabolic fee base_fee = shares * fee_rate * price * (1 - price) is preserved; maker fee handling is untouched."
  - name: "Dispute Bond Semantics"
    formula: "A dispute requires AGX_DISPUTE_MIN_STAKE (100) of spendable balance and at most one active AgxDisputeStake per (user_id, market_id), else HTTP 409 AGX_DISPUTE_EXISTS. Upheld disputes set status RETURNED, return the bonded amount and credit a 20 percent bonus from the staker pool as a DISPUTE_REWARD ledger entry. Rejected disputes set status SLASHED, credit nothing to the user, and move the full bond to AGX_TREASURY_ADDRESS as a SLASH entry."
  - name: "Gating Bonds"
    formula: "Pro Desk activation requires locked_gating_balance >= AGX_DESK_MIN_STAKE (500) recorded in AgxDeskStake; official or curated market deployment requires AGX_MARKET_MIN_STAKE (1000) recorded in AgxMarketStake; community market creation keeps its 50 USDC anti-spam bond and Tier 2 and above receive a 50 percent reduction to 25 USDC. Insufficient gating balance returns HTTP 409 AGX_INSUFFICIENT_GATE. Bonds are refunded only on clean desk archive or final market settlement, emitting GATING_RELEASE."
  - name: "Epoch Fee Split"
    formula: "Every fill contributes taker and maker fees to the active epoch; on distribution the collected total is split AGX_CREATOR_FEE_SHARE (0.40) to the market creator account and AGX_STAKER_FEE_SHARE (0.60) to the staker pool, and total_fees_collected equals creator_share + staker_pool exactly."
  - name: "Proportional Reward"
    formula: "user_reward = staker_pool * (user_staked_balance / total_staked_supply) quantized to 18 decimal places with ROUND_DOWN; when total_staked_supply is zero the staker pool stays undistributed and no user is credited."
  - name: "Epoch Idempotency"
    formula: "AGX_REWARD_EPOCH_HOURS is 24; AgxRewardEpoch.epoch_number is unique; distributing an epoch whose distributed flag is already true returns HTTP 409 AGX_EPOCH_ALREADY_DISTRIBUTED and performs no ledger writes. Claiming rewards moves pending_rewards to spendable balance and emits exactly one FEE_REWARD entry, leaving the remainder safe for later epochs."
  - name: "Decimal Money"
    formula: "All AGX balances, stakes, bonds, fees and rewards use SQLAlchemy Numeric(36, 18) and Python Decimal; JSON serialization emits decimal strings; float conversion is prohibited in token arithmetic and only permitted for non-monetary display fields outside AGX routes."
acceptance_criteria:
  - test: "Tier discount worked example"
    steps: "With base_fee=2.000000000000000000 assert apply_fee_discount is 2.000000000000000000 for 0 staked, 1.900000000000000000 for 250 staked, 1.800000000000000000 for 2500 staked and 1.700000000000000000 for 6000 staked, and that a user with no AgxBalance row stays at 2.000000000000000000"
  - test: "Stake lock worked example"
    steps: "Stake 100 at T0; unstake at T0+6d returns 422 AGX_STAKE_LOCKED and leaves staked_balance at 100; unstake at T0+7d succeeds and creates a PENDING cooldown with cooldown_until = T0+10d"
  - test: "Cooldown withdrawal worked example"
    steps: "Withdraw a PENDING cooldown at T0+9d returns 422 AGX_COOLDOWN_ACTIVE with the amount still PENDING; withdraw at T0+10d returns the amount to spendable balance, sets status COMPLETED, the stake status WITHDRAWN, and appends one WITHDRAW_STAKE ledger row"
  - test: "Epoch split and proportional reward worked example"
    steps: "Seed total_fees_collected=1000.000000000000000000 with two stakers holding 3000 and 1000 of a 4000 total_staked_supply; assert creator share 400.000000000000000000, staker pool 600.000000000000000000, rewards 450.000000000000000000 and 150.000000000000000000, and that a second distribution returns 409 AGX_EPOCH_ALREADY_DISTRIBUTED without new ledger rows"
  - test: "Dispute settlement worked example"
    steps: "Bond 100 with a 20 percent bonus: upheld returns 100 to spendable balance and credits 20 as DISPUTE_REWARD; rejected leaves the user at 0 returned, marks the stake SLASHED, and credits the treasury address 100 as SLASH. A second active dispute for the same user and market returns 409 AGX_DISPUTE_EXISTS"
  - test: "Gating thresholds"
    steps: "Desk activation with 499.999999999999999999 locked returns 409 AGX_INSUFFICIENT_GATE while 500 succeeds; official market deployment with 999.999999999999999999 returns 409 while 1000 succeeds; a Tier 2 staker pays a 25.0000 community bond instead of 50.0000"
  - test: "Zero-token regression"
    steps: "With no AgxBalance row, an authenticated user registers, deposits USDC, places a crossing BUY order, receives a fill at the unchanged parabolic fee, withdraws collateral, and redeems a settled winning position, all with 2xx responses and no AGX-dependent error"
  - test: "Change is additive"
    steps: "Run pytest tests/test_route_baseline.py and assert every method and path recorded in .githeri/baseline.json still resolves"
