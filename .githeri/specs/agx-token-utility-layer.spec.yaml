    description: "MODIFY: enforce the 500 AGX activation bond inside the existing Pro Desk creation route in app/api/v1/desks.py"
    type: create
    blueprint: |
      # Delta to the existing POST /api/v1/desks handler in app/api/v1/desks.py.
      # Resolve the caller's gating bond before the desk row is committed.
      from app.services import agx

      async def _require_desk_bond(session, user):
          balance = await agx.get_balance(session, user.id)
          if balance.locked_gating_balance < Decimal("500"):
              raise HTTPException(status_code=409, detail="AGX_INSUFFICIENT_GATE")
    acceptance_criteria:
      - test: "Desk gating is enforced"
        steps: "Assert a caller with 499.999999999999999999 locked receives 409 AGX_INSUFFICIENT_GATE and a caller with 500 receives 201"
      - test: "Existing desk behavior is preserved"
