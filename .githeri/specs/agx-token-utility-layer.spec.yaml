  - method: GET
    path: /api/v1/agx/tiers
  - method: POST
    path: /api/v1/agx/dispute-stake
  - method: GET
    path: /api/v1/agx/dispute-stakes
  - method: POST
    path: /api/v1/agx/sync-balance
  - method: GET
