local_goals:
  - id: L1
    description: "INSPECT: confirm the existing model module, helpers and numeric conventions before extending them"
    type: inspect
    verification:
      type: file_exists
      path: "app/models/domain.py"
      expect:
        exists: true
        content_contains: "class Desk"
  - id: L2
    description: "MODIFY: append the AGX entities to app/models/domain.py without redeclaring Base, _uuid or _now_utc"
    type: create
    blueprint: |
      # Appended to the existing app/models/domain.py. Reuse Base, _uuid and
      # _now_utc already declared at module scope.
      from sqlalchemy import Boolean, Column, DateTime, ForeignKey, Numeric, String, UniqueConstraint

      AGX = Numeric(36, 18)

      class AgxBalance(Base):
          __tablename__ = "agx_balances"
          user_id = Column(String(36), ForeignKey("users.id"), primary_key=True)
          balance = Column(AGX, nullable=False, default=0)
          staked_balance = Column(AGX, nullable=False, default=0)
          locked_gating_balance = Column(AGX, nullable=False, default=0)
          locked_dispute_balance = Column(AGX, nullable=False, default=0)
          pending_rewards = Column(AGX, nullable=False, default=0)
          last_reward_epoch = Column(String(36), nullable=True)
          updated_at = Column(DateTime(timezone=True), default=_now_utc, onupdate=_now_utc)

      # Also append: AgxStake (locked_until, status), AgxUnstakeCooldown
      # (stake_id, cooldown_until, status), AgxDisputeStake (unique
      # user_id + market_id for active rows), AgxDeskStake, AgxMarketStake,
      # AgxRewardEpoch (unique epoch_number, distributed) and AgxLedger
      # (user_id, kind, amount, balance_after, reference_id, created_at).
    acceptance_criteria:
      - test: "Models are additive"
        steps: "Read app/models/domain.py and confirm the AGX classes exist beside User, Market, Order, Desk and that Base and the helpers were not replaced"
      - test: "Precision is fixed point"
        steps: "Confirm every AGX money column is Numeric(36, 18) and no Float column is introduced"
    verification:
      type: file_exists
      path: "app/models/domain.py"
      expect:
        exists: true
        content_contains: "class AgxLedger"
  - id: L3
    description: "CREATE: the AGX service layer in app/services/agx.py implementing the full documented function surface"
    type: create
    blueprint: |
      from decimal import ROUND_DOWN, Decimal

      from sqlalchemy import select

      from app.models.domain import (
          AgxBalance,
          AgxDisputeStake,
          AgxLedger,
          AgxRewardEpoch,
          AgxStake,
          AgxUnstakeCooldown,
      )

      Q18 = Decimal("0.000000000000000001")
      LADDER = (
          (Decimal("5000"), "3", Decimal("0.15")),
          (Decimal("1000"), "2", Decimal("0.10")),
          (Decimal("100"), "1", Decimal("0.05")),
      )

      def q18(value) -> Decimal:
          return Decimal(value).quantize(Q18, rounding=ROUND_DOWN)

      def tier_for(staked: Decimal):
          for floor, tier, discount in LADDER:
              if staked >= floor:
                  return tier, discount
          return "0", Decimal("0")

      def _ledger(session, user_id, kind, amount, balance_after, reference_id):
          session.add(
              AgxLedger(
                  user_id=user_id,
                  kind=kind,
                  amount=q18(amount),
                  balance_after=q18(balance_after),
                  reference_id=reference_id,
              )
          )

      async def get_balance(session, user_id, for_update=False):
          stmt = select(AgxBalance).where(AgxBalance.user_id == user_id)
          if for_update:
              stmt = stmt.with_for_update()
          row = (await session.execute(stmt)).scalar_one_or_none()
          if row is None:
              row = AgxBalance(
                  user_id=user_id,
                  balance=Decimal(0),
                  staked_balance=Decimal(0),
                  locked_gating_balance=Decimal(0),
                  locked_dispute_balance=Decimal(0),
                  pending_rewards=Decimal(0),
              )
              session.add(row)
              await session.flush()
          return row

      async def get_tier(session, user_id):
          row = await get_balance(session, user_id)
          return tier_for(Decimal(row.staked_balance))[0]

      async def apply_fee_discount(user_id, base_fee, session=None):
          if session is None:
              return q18(base_fee)
          stmt = select(AgxBalance).where(AgxBalance.user_id == user_id)
          row = (await session.execute(stmt)).scalar_one_or_none()
          if row is None:
              return q18(base_fee)
          _, discount = tier_for(Decimal(row.staked_balance))
          return q18(Decimal(base_fee) * (Decimal("1") - discount))

      async def stake(session, user_id, amount):
          amount = q18(amount)
          if amount < Decimal("1"):
              raise ValueError("AGX_STAKE_BELOW_MINIMUM")
          row = await get_balance(session, user_id, for_update=True)
          if Decimal(row.balance) < amount:
              raise ValueError("AGX_INSUFFICIENT_BALANCE")
          row.balance = Decimal(row.balance) - amount
          row.staked_balance = Decimal(row.staked_balance) + amount
          record = AgxStake(user_id=user_id, amount=amount, status="ACTIVE")
          session.add(record)
          await session.flush()
          _ledger(session, user_id, "STAKE", amount, row.balance, record.id)
          return record

      async def unstake(session, user_id, stake_id):
          record = await session.get(AgxStake, stake_id, with_for_update=True)
          if record is None or record.user_id != user_id:
              raise LookupError("AGX_STAKE_NOT_FOUND")
          if record.status != "ACTIVE":
              raise ValueError("AGX_STAKE_NOT_ACTIVE")
          if record.locked_until > now_utc():
              raise ValueError("AGX_STAKE_LOCKED")
          record.status = "COOLDOWN"
          cooldown = AgxUnstakeCooldown(
              stake_id=record.id, user_id=user_id, amount=record.amount, status="PENDING"
          )
          session.add(cooldown)
          await session.flush()
          _ledger(session, user_id, "UNSTAKE_COOLDOWN", record.amount, record.amount, cooldown.id)
          return cooldown

      async def withdraw(session, user_id, cooldown_id):
          cooldown = await session.get(AgxUnstakeCooldown, cooldown_id, with_for_update=True)
          if cooldown is None or cooldown.user_id != user_id:
              raise LookupError("AGX_COOLDOWN_NOT_FOUND")
          if cooldown.status != "PENDING":
              raise ValueError("AGX_COOLDOWN_NOT_PENDING")
          if cooldown.cooldown_until > now_utc():
              raise ValueError("AGX_COOLDOWN_ACTIVE")
          row = await get_balance(session, user_id, for_update=True)
          cooldown.status = "COMPLETED"
          row.staked_balance = Decimal(row.staked_balance) - Decimal(cooldown.amount)
          row.balance = Decimal(row.balance) + Decimal(cooldown.amount)
          _ledger(session, user_id, "WITHDRAW_STAKE", cooldown.amount, row.balance, cooldown.id)
          return cooldown

      async def stake_dispute(session, user_id, market_id, amount):
          existing = (
              await session.execute(
                  select(AgxDisputeStake).where(
                      AgxDisputeStake.user_id == user_id,
                      AgxDisputeStake.market_id == market_id,
                      AgxDisputeStake.status == "LOCKED",
                  )
              )
          ).scalar_one_or_none()
          if existing is not None:
              raise ValueError("AGX_DISPUTE_EXISTS")
          row = await get_balance(session, user_id, for_update=True)
          if Decimal(row.balance) < q18(amount):
              raise ValueError("AGX_INSUFFICIENT_BALANCE")
          row.balance = Decimal(row.balance) - q18(amount)
          row.locked_dispute_balance = Decimal(row.locked_dispute_balance) + q18(amount)
          bond = AgxDisputeStake(user_id=user_id, market_id=market_id, amount=q18(amount), status="LOCKED")
          session.add(bond)
          await session.flush()
          _ledger(session, user_id, "DISPUTE_LOCK", bond.amount, row.balance, bond.id)
          return bond

      async def resolve_dispute(session, dispute_id, upheld: bool):
          bond = await session.get(AgxDisputeStake, dispute_id, with_for_update=True)
          if bond is None or bond.status != "LOCKED":
              raise ValueError("AGX_DISPUTE_NOT_LOCKED")
          row = await get_balance(session, bond.user_id, for_update=True)
          row.locked_dispute_balance = Decimal(row.locked_dispute_balance) - Decimal(bond.amount)
          if upheld:
              bonus = q18(Decimal(bond.amount) * Decimal("0.20"))
              row.balance = Decimal(row.balance) + Decimal(bond.amount) + bonus
              bond.status = "RETURNED"
              _ledger(session, bond.user_id, "DISPUTE_RETURN", bond.amount, row.balance, bond.id)
              _ledger(session, bond.user_id, "DISPUTE_REWARD", bonus, row.balance, bond.id)
          else:
              bond.status = "SLASHED"
              _ledger(session, bond.user_id, "SLASH", bond.amount, row.balance, bond.id)
          return bond

      async def lock_desk_gating(session, user_id, desk_id, amount):
          return await _lock_gating(session, user_id, desk_id, "DESK", amount)

      async def release_desk_gating(session, user_id, desk_id):
          return await _release_gating(session, user_id, desk_id, "DESK")

      async def lock_market_gating(session, user_id, market_id, amount):
          return await _lock_gating(session, user_id, market_id, "MARKET", amount)

      async def release_market_gating(session, user_id, market_id):
          return await _release_gating(session, user_id, market_id, "MARKET")

      async def sync_balance(session, user_id, verified_deposit):
          row = await get_balance(session, user_id, for_update=True)
          delta = q18(verified_deposit)
          if delta <= 0:
              return row
          row.balance = Decimal(row.balance) + delta
          _ledger(session, user_id, "DEPOSIT", delta, row.balance, "onchain-sync")
          return row

      async def distribute_epoch(session, epoch_number=None):
          epoch = AgxRewardEpoch(epoch_number=epoch_number or next_epoch_number(), distributed=False)
          session.add(epoch)
          await session.flush()
          if epoch.distributed:
              raise ValueError("AGX_EPOCH_ALREADY_DISTRIBUTED")
          total = q18(epoch.total_fees_collected)
          staker_pool = q18(total * Decimal("0.60"))
          epoch.reward_per_token = (
              q18(staker_pool / Decimal(epoch.total_staked_supply))
              if Decimal(epoch.total_staked_supply) > 0
              else Decimal(0)
          )
          epoch.distributed = True
          return epoch

      async def claim_rewards(session, user_id):
          row = await get_balance(session, user_id, for_update=True)
          amount = q18(row.pending_rewards)
          if amount <= 0:
              return Decimal(0)
          row.pending_rewards = Decimal(0)
          row.balance = Decimal(row.balance) + amount
          _ledger(session, user_id, "FEE_REWARD", amount, row.balance, "claim")
          return amount
    acceptance_criteria:
      - test: "Every contracted function exists"
        steps: "Assert all fifteen names resolve from app.services.agx and that amounts are Decimal at the boundary"
      - test: "Ledger invariant holds"
        steps: "After stake, unstake, withdraw, dispute and claim calls assert the sum of the user's signed ledger amounts equals the spendable balance and that every row carries the correct balance_after"
    verification:
      type: file_exists
      path: "app/services/agx.py"
      expect:
        exists: true
        content_contains: "apply_fee_discount"
  - id: L4
    description: "MODIFY: hook the taker-fee discount into app/engine/clob.py without touching the matching loop"
    type: create
    blueprint: |
      # Delta to the existing MatchingEngine._execute_fill. Keep the parabolic
      # compute_fee base, then apply the AGX discount to the taker fee only.
      from app.services import agx

      base_taker_fee = compute_fee(qty, fee_rate, fill_price)
      taker_fee = await agx.apply_fee_discount(taker.user_id, base_taker_fee, session=session)
      maker_fee = compute_fee(qty, fee_rate, fill_price)
    acceptance_criteria:
      - test: "Base fee is preserved for Tier 0"
        steps: "Assert a zero-AGX taker pays exactly the pre-change parabolic fee for the same shares, price and category"
      - test: "Discount is taker-only"
        steps: "Assert a Tier 3 taker pays 85 percent of the base fee while the maker fee is unchanged"
