task_id: agx-token-utility-layer
status: planned
archetype: brownfield_token_utility
summary: "Algoxen (AGX) token utility layer for Dolymarket: staking with lock/cooldown periods, tiered fee discounts, oracle dispute staking with slashing, Pro Desk and market creation gating, epoch-based reward distribution, and on-chain balance sync. All amounts use Decimal precision (18 decimals)."
entrypoint: app/main.py
scope: "Brownfield change to the existing FastAPI + React Dolymarket repository. Add AGX database models (stakes, cooldowns, dispute stakes, creation locks, reward epochs), add AGX service layer with staking/unstaking/withdrawal/reward/dispute/gating logic, add API routes under /api/v1/agx/*, integrate fee discounts into the order execution path, integrate dispute staking into the resolution flow, integrate desk/market creation gating into admin and desk routes, add AGX balance display to the frontend, and cover all flows with hermetic tests. Do not scaffold a new project and do not regenerate existing files."
out_of_scope:
  - "On-chain ERC-20 contract deployment or smart contract code (the contract address is configured via AGX_TOKEN_ADDRESS)"
  - "Wallet connection (MetaMask/WalletConnect) — balance sync uses a manual or indexer-driven endpoint"
  - "Token transfer UI or DEX integration for acquiring AGX"
  - "Governance voting or DAO mechanics"
  - "Multi-chain support beyond the configured AGX_CHAIN_ID"
assumptions:
  - "AGX is an ERC-20 token with 18 decimals on the configured chain (AGX_CHAIN_ID)"
  - "The local database tracks AGX balances for fast reads; on-chain sync is triggered manually or by an indexer"
  - "Staking, unstaking, and reward claiming are off-chain ledger operations backed by on-chain deposits"
  - "The existing CollateralAccount and fee system remains unchanged; AGX fee discounts are applied as a multiplier at execution time"
  - "Decimal precision (18 decimals) is used for all AGX amounts, matching the ERC-20 standard"
  - "The existing optimistic oracle (propose/dispute/resolve) is extended with AGX dispute staking"
business_rules:
  - name: "Staking Minimum and Precision"
    formula: "Minimum stake is 1 AGX. All balance, stake, and reward values use Decimal with 18 decimal places. No floating point in any AGX calculation."
  - name: "Unstaking Lock and Cooldown"
    formula: "Staked AGX has a minimum lock period of 7 days (AGX_MIN_STAKE_LOCK_DAYS). Unstaking initiates a cooldown of 3 days (AGX_UNSTAKE_COOLDOWN_DAYS). Funds can only be withdrawn after both the lock period and cooldown have elapsed."
  - name: "Fee Discount Tiers"
    formula: "Staked AGX grants tiered taker-fee discounts: Tier 1 (100-999 AGX) = 5%, Tier 2 (1000-4999 AGX) = 10%, Tier 3 (5000+ AGX) = 15%. Discount = fee * (1 - tier_rate). Applied at order execution. Zero staked = no discount."
  - name: "Dispute Staking"
    formula: "Disputing a market resolution requires staking minimum 100 AGX (AGX_DISPUTE_MIN_STAKE). Maximum 1 active dispute stake per user per market. If upheld: disputer receives stake back + reward from loser's stake. If rejected: disputer's stake is slashed to protocol treasury. Dispute stakes are locked until resolution."
  - name: "Desk Creation Gating"
    formula: "Creating a Pro Desk requires locking 500 AGX (AGX_DESK_MIN_STAKE). The AGX is locked for the desk's active lifetime. On archive or rejection, locked AGX is returned (minus slashing for violations)."
  - name: "Market Creation Gating"
    formula: "Creating a market (admin) requires locking 1000 AGX (AGX_MARKET_MIN_STAKE). The AGX is returned when the market resolves or is closed."
  - name: "Epoch Reward Distribution"
    formula: "Rewards distributed per epoch (24h, AGX_REWARD_EPOCH_HOURS). user_reward = total_fees_collected * (user_staked_balance / total_staked_supply). Idempotent: cannot distribute the same epoch twice. Unclaimed rewards accumulate."
  - name: "Balance Sync"
    formula: "Local AGX balance is synced from on-chain via POST /api/v1/agx/sync-balance. Deposits and withdrawals are recorded in the AGX ledger. Local balance may not exceed on-chain balance."
  - name: "Slashing Destination"
    formula: "Slashed AGX (from rejected disputes or desk violations) goes to the protocol treasury, not redistributed to stakers."
  - name: "Precision"
    formula: "All AGX amounts stored as Numeric(36,18) in the database. All calculations use Decimal. Float is only used at the JSON serialization boundary."
