acceptance_criteria:
  - test: "Stake and unstake lifecycle"
    steps: "Stake 100 AGX, verify balance decreases and staked balance increases. Attempt unstake before 7-day lock expires -> 422. After lock, unstake -> cooldown starts. Attempt withdraw during cooldown -> 422. After cooldown, withdraw -> balance restored."
  - test: "Fee discount by tier"
    steps: "With 0 staked, fee discount is 0%. With 500 staked, discount is 5%. With 2000 staked, discount is 10%. With 6000 staked, discount is 15%. Verify Decimal precision in all calculations."
  - test: "Dispute stake lifecycle"
    steps: "Stake 100 AGX to dispute a market. Verify stake is locked. Resolve dispute as upheld -> stake returned + reward. Resolve as rejected -> stake slashed. Attempt second dispute on same market -> 409. Attempt dispute with < 100 AGX -> 422."
  - test: "Desk creation gating"
    steps: "Attempt desk creation with < 500 AGX staked -> 422. With 500+ AGX staked, desk created and AGX locked. Archive desk -> AGX returned."
  - test: "Market creation gating"
    steps: "Admin creates market with < 1000 AGX staked -> 422. With 1000+ AGX, market created and AGX locked. Market resolves -> AGX returned."
  - test: "Reward distribution"
    steps: "Distribute epoch rewards, verify proportional payout. Attempt duplicate distribution -> 409. Claim rewards, verify balance updated. Verify unclaimed rewards accumulate."
  - test: "Balance sync"
    steps: "Sync on-chain balance, verify local balance matches. Attempt to stake more than local balance -> 422."
  - test: "Edge cases"
    steps: "Stake 0 AGX -> 422. Unstake more than staked -> 422. Withdraw before cooldown -> 422. Double epoch distribution -> 409. Stake during cooldown -> 422."
test_fixtures: []
