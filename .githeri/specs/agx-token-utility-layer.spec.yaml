    description: "MODIFY: extend the AGX router in app/api/v1/agx.py with all fourteen contracted routes"
    type: modify
    blueprint: |
      # Additive route delta on the existing ``router`` object. Amounts arrive
      # as decimal strings and are parsed with agx.parse_amount; domain errors
      # raise AgxError and are mapped by the handler registered in app/main.py.
      from fastapi import Depends
      from pydantic import BaseModel, StrictStr

      from app.api.deps import get_current_user
      from app.db.session import get_async_session
      from app.services import agx

      class AmountBody(BaseModel):
          amount: StrictStr

      @router.post("/stake", status_code=201)
      async def stake_agx(body: AmountBody, user=Depends(get_current_user), session=Depends(get_async_session)):
          record = await agx.stake(session, user.id, agx.parse_amount(body.amount))
          return {
              "status": record.status,
              "stake": _stake_payload(record),
              "balance": _balance_payload(await agx.get_balance(session, user.id)),
          }

      # Also add: POST /unstake, POST /withdraw, GET /balance, GET /stakes,
      # POST /claim-rewards, GET /rewards/history, GET /tiers (public),
      # POST /dispute-stake, GET /dispute-stakes, POST /sync-balance (admin),
      # GET /stats (public), POST /epochs/distribute (admin), GET /epochs
      # (public). Every authenticated route depends on get_current_user and
      # get_async_session; admin routes additionally require user.is_admin and
      # return 403 AGX_FORBIDDEN otherwise.
    acceptance_criteria:
