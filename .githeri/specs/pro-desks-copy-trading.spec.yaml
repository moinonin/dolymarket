        content_contains: "follow_desk"
  - id: L7
    description: "MODIFY: extend the existing CreateOrderRequest and submit_order in app/api/v4/orders.py with an optional desk_id tag and the conflict rules"
    type: create
    blueprint: |
      # Delta to the existing app/api/v4/orders.py. Add one optional field to the
      # existing CreateOrderRequest and run the desk guard inside submit_order
      # before the engine is called. Do not add a second order route.
      from app.models.domain import Desk

      def _assert_desk_tag(desk, user, market_id, desk_position):
          if desk is None:
              # untagged personal order in a market where the caller's ACTIVE
              # desk holds a position -> 409 DESK_MARKET_CONFLICT
              return None
          if desk.owner_user_id != user.id:
              raise PermissionError("DESK_ORDER_FORBIDDEN")  # -> HTTP 403
          if desk.status != "ACTIVE":
              raise LookupError("DESK_NOT_ACTIVE")  # -> HTTP 409
          return desk.id
    acceptance_criteria:
      - test: "Desk tagging is owner-scoped"
        steps: "Assert the owner's tagged order returns 201, another user's tagged order returns 403 DESK_ORDER_FORBIDDEN and an unknown desk_id returns 404"
      - test: "Existing behavior is preserved"
        steps: "Assert requests without desk_id keep the X-Idempotency-Key replay behavior unchanged"
    verification:
      type: file_exists
      path: "app/api/v4/orders.py"
      expect:
        exists: true
        content_contains: "desk_id"
  - id: L8
    description: "MODIFY: add the desk review routes to the existing admin router in app/api/v4/admin.py, guarded by User.is_admin"
    type: create
    blueprint: |
      # Delta to the existing app/api/v4/admin.py (prefix /api/v4/prediction/admin).
      from fastapi import Depends, HTTPException

      from app.api.deps import get_current_user

      async def _require_admin(user=Depends(get_current_user)):
          # Authenticated but is_admin is False -> HTTP 403 ADMIN_REQUIRED
          # Anonymous -> HTTP 401
          if not getattr(user, "is_admin", False):
              raise PermissionError("ADMIN_REQUIRED")
          return user
    acceptance_criteria:
      - test: "Admin authorization is enforced"
        steps: "Assert an authenticated caller without is_admin receives 403 ADMIN_REQUIRED and an anonymous caller receives 401"
    verification:
      type: file_exists
      path: "app/api/v4/admin.py"
      expect:
        exists: true
        content_contains: "is_admin"
  - id: L9
    description: "MODIFY: mount the new desks router in app/main.py beside the existing include_router calls"
    type: create
    blueprint: |
      # Delta to the existing app/main.py. Add the import next to the other
      # app.api.v1 imports and one include_router call next to the existing ones.
      from app.api.v1 import desks as desks_router

      app.include_router(desks_router.router)
    acceptance_criteria:
      - test: "Mounting does not disturb existing routes"
        steps: "Assert app/main.py still exposes every endpoint in .githeri/baseline.json"
    verification:
      type: file_exists
      path: "app/main.py"
      expect:
        exists: true
        content_contains: "desks_router"
