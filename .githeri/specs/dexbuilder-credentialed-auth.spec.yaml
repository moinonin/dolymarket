task_id: dexbuilder-credentialed-auth
status: active
archetype: brownfield_api_integration
summary: "Credentialed DexBuilder access: sign upstream REST requests with the official HMAC-SHA512 scheme, surface upstream credential rejection as a distinct error, and expose a read-only credential diagnostic."
entrypoint: app/main.py
scope: "Brownfield change to the existing FastAPI + React Dolymarket repository. Rework the signing in app/services/dexbuilder.py, map upstream credential failures in app/api/v4/dexbuilder/proxy.py, add a credential diagnostic route to app/api/v4/prediction/live.py, surface the diagnostic in the live frontend page and cover the scheme with hermetic tests. Do not scaffold a new project and do not regenerate existing files."
out_of_scope:
  - "Placing, cancelling or amending orders against upstream DexBuilder markets"
  - "Streaming live data over the upstream websocket broker (the broker currently answers HTTP 503 for every channel)"
  - "Persisting the API secret anywhere other than the environment"
  - "Modifying the local seeded market universe or the local trading engine"
assumptions:
  - "The upstream validates the API key before the signature, so HTTP 401 with label INVALID_KEY means the configured key is not registered upstream and never means the signature is wrong"
  - "The official DexBuilder signing spec is: headers KEY, Timestamp (unix seconds), SIGN; signed message = METHOD + newline + PATH + newline + QUERY + newline + HexEncode(SHA512(raw body)) + newline + TIMESTAMP; SIGN = HexEncode(HMAC_SHA512(api_secret, signed message))"
  - "Public upstream reads need no credentials and keep working whether or not a secret is configured"
business_rules:
  - name: "Official Signing Scheme"
    formula: "When DEXBUILDER_API_SECRET is set every upstream request carries exactly the headers KEY, Timestamp and SIGN, where SIGN is the hexadecimal HMAC-SHA512 digest of METHOD\nPATH\nQUERY\nHexEncode(SHA512(raw body))\nTIMESTAMP keyed by the API secret and the Timestamp header is the unix second timestamp that is also the last line of the signed message."
  - name: "Query String Fidelity"
    formula: "The query string inside the signed message is byte-identical to the query string that is sent; the client encodes the parameters once, signs that exact string and sends it unchanged without re-sorting."
  - name: "Body Hash Fidelity"
    formula: "The fourth signed line is HexEncode(SHA512(raw body)) computed over the exact bytes sent; an empty body hashes to cf83e1357eefb8bdf1542850d66d8007d620e4050b5715dc83f4a921d36ce9ce47d0d13c5d85f2b0ff8318d2877eec2f63b931bd47417a81a538327af927da3e."
  - name: "Unsigned Public Reads"
    formula: "When no secret is configured no signature header is attached, so public upstream reads keep working; the /api/v4/dexbuilder proxy namespace still answers HTTP 503 DEXBUILDER_NOT_CONFIGURED when DEXBUILDER_API_KEY is empty."
  - name: "Credential Rejection Is Explicit"
    formula: "An upstream HTTP 401 or 403 on a credentialed call raises a distinct credential error carrying the upstream label (INVALID_KEY, INVALID_SIGNATURE, IP_FORBIDDEN, READ_ONLY, FORBIDDEN); the proxy answers HTTP 502 DEXBUILDER_UPSTREAM_UNAUTHORIZED with the upstream label in the X-Upstream-Error header instead of the generic DEXBUILDER_BAD_RESPONSE."
  - name: "Credential Diagnostic Never Leaks Secrets"
    formula: "The credential diagnostic reports only whether a key and a secret are present, the signing scheme in use and the upstream outcome (status, label, message); the API key and the API secret are never returned, logged or echoed."
endpoints:
  - method: GET
    path: /api/v4/prediction/live/auth
acceptance_criteria:
  - test: "Canonical signed message"
    steps: "Build the signed message for GET /api/v1/dex_futures/usdt/orders with query status=finished&limit=50, an empty body and timestamp 1541993715 and assert it equals the five documented lines METHOD, PATH, QUERY, the SHA512 of the empty body and the timestamp."
  - test: "Signed query equals sent query"
    steps: "With a mocked upstream, assert the query string of the captured request is exactly the query string that was signed and that recomputing the signature from the captured request reproduces the SIGN header."
  - test: "Upstream credential rejection"
    steps: "With an upstream answering HTTP 401 and body label INVALID_KEY, assert the client raises the credential error with label INVALID_KEY and that the proxy answers HTTP 502 with detail DEXBUILDER_UPSTREAM_UNAUTHORIZED and header X-Upstream-Error INVALID_KEY."
  - test: "Credential diagnostic"
    steps: "Assert GET /api/v4/prediction/live/auth reports configured=true, scheme HMAC-SHA512, authenticated=false and upstream.label INVALID_KEY when the upstream rejects the key, and that the response body contains neither the API key nor the API secret."
  - test: "Unsigned public read"
    steps: "With DEXBUILDER_API_SECRET empty assert the upstream request carries no KEY, Timestamp or SIGN header and the proxy still answers HTTP 503 DEXBUILDER_NOT_CONFIGURED when the key is empty."
test_fixtures: []
environment:
  packages: ["fastapi", "httpx", "pydantic", "pytest", "pytest-asyncio"]
  env_vars:
    DEXBUILDER_API_BASE: "https://api.dexbuilder.com"
    DEXBUILDER_API_KEY: ""
    DEXBUILDER_API_SECRET: ""
  services: []
global_verification:
  - "pytest tests/test_dexbuilder_auth.py"
  - "pytest tests/test_dexbuilder_parity.py"
  - "pytest tests/test_live_data.py"
context:
  language: Python
  framework: FastAPI
  test_framework: pytest
